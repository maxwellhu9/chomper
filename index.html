<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chomp Cam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <video id="cam" playsinline muted></video>
    <canvas id="screen"></canvas>

    <div id="title" class="panel top">
      <h1>CHOMP<span>CAM</span></h1>
      <p class="tag">a game you play with your face · no hands needed</p>
      <p id="status" class="cta">warming up face tracker…</p>
    </div>

    <aside id="board" class="side"></aside>

    <div id="countdown" class="big hidden"></div>

    <div id="over" class="panel hidden">
      <h2 id="overTitle"></h2>
      <div id="overBody"></div>
      <form id="save">
        <input id="name" maxlength="10" placeholder="your name" autocomplete="off" />
        <button>save</button>
      </form>
      <p id="overHint" class="hint"></p>
    </div>

    <button id="mute" title="mute (M)">🔊</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
